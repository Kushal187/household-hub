<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chores | HouseholdHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/chores.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">HouseholdHub</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="/chores.html">Chores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/expenses.html">Expenses</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <h1 class="mb-4">Chores</h1>

      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Add a Chore</h5>
          <form id="chore-form" class="row g-3 align-items-end">
            <div class="col-md-5">
              <label for="chore-title" class="form-label">Title</label>
              <input type="text" class="form-control" id="chore-title" required />
            </div>
            <div class="col-md-4">
              <label for="chore-deadline" class="form-label">Deadline</label>
              <input type="date" class="form-control" id="chore-deadline" required />
            </div>
            <div class="col-md-3">
              <button type="submit" class="btn btn-primary w-100">Add Chore</button>
            </div>
          </form>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Chore List</h5>
        <select id="status-filter" class="form-select w-auto">
          <option value="">All</option>
          <option value="open">Open</option>
          <option value="claimed">Claimed</option>
          <option value="done">Done</option>
        </select>
      </div>

      <div id="chore-message" class="alert d-none"></div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>Title</th>
              <th>Deadline</th>
              <th>Assigned To</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="chore-list"></tbody>
        </table>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/choresPage.js"></script>
  </body>
</html>
