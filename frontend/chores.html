<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chores - HouseholdHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/chores.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>

  <body>
    <nav class="main-nav">
      <div class="nav-brand">
        <a href="/">HouseholdHub</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/people.html">People</a></li>
        <li><a href="/chores.html" class="active">Chores</a></li>
        <li><a href="/expenses.html">Expenses</a></li>
      </ul>
    </nav>

    <main class="chores-container">
      <header class="page-header">
        <h1>Chore Board</h1>
        <p>Manage and track household tasks</p>
      </header>

      <section class="chore-form-section">
        <h2>Add New Chore</h2>
        <form id="chore-form">
          <div class="form-group">
            <label for="chore-title">Title</label>
            <input
              type="text"
              id="chore-title"
              name="title"
              placeholder="e.g. Clean kitchen"
              required
            />
          </div>
          <div class="form-group">
            <label for="chore-description">Description</label>
            <textarea
              id="chore-description"
              name="description"
              placeholder="Describe the task..."
              rows="3"
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="chore-createdBy">Created By</label>
              <select id="chore-createdBy" name="createdBy" required>
                <option value="">Select person</option>
              </select>
              <div id="created-by-hint"></div>
            </div>
            <div class="form-group">
              <label for="chore-deadline">Deadline</label>
              <input type="date" id="chore-deadline" name="deadline" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add Chore</button>
        </form>
      </section>

      <section class="chore-filters">
        <label for="filter-status">Filter by status:</label>
        <select id="filter-status">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="claimed">Claimed</option>
          <option value="completed">Completed</option>
        </select>
        <label for="sort-by">Sort by:</label>
        <select id="sort-by">
          <option value="createdAt">Newest First</option>
          <option value="deadline">Deadline</option>
        </select>
      </section>

      <section class="chore-board" id="chore-board">
        <p class="loading">Loading chores...</p>
      </section>

      <div class="pagination" id="pagination"></div>
    </main>

    <div
      id="claim-modal"
      class="claim-modal"
      role="dialog"
      aria-labelledby="claim-modal-title"
      aria-modal="true"
      hidden
    >
      <div class="claim-modal-overlay"></div>
      <div class="claim-modal-content">
        <h3 id="claim-modal-title">Who is claiming this chore?</h3>
        <div class="form-group">
          <label for="claim-person">Person</label>
          <select id="claim-person">
            <option value="">Select person</option>
          </select>
        </div>
        <div class="claim-modal-actions">
          <button type="button" class="btn" id="claim-modal-cancel">
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-primary"
            id="claim-modal-confirm"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/chores.js"></script>
  </body>
</html>
