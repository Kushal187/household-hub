<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses | HouseholdHub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/expenses.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">HouseholdHub</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/chores.html">Chores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/expenses.html">Expenses</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      <h1 class="mb-4">Expenses</h1>

      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Add an Expense</h5>
          <form id="expense-form" class="row g-3 align-items-end">
            <div class="col-md-3">
              <label for="expense-desc" class="form-label">Description</label>
              <input type="text" class="form-control" id="expense-desc" required />
            </div>
            <div class="col-md-2">
              <label for="expense-amount" class="form-label">Amount ($)</label>
              <input
                type="number"
                class="form-control"
                id="expense-amount"
                min="0.01"
                step="0.01"
                required
              />
            </div>
            <div class="col-md-2">
              <label for="expense-paid-by" class="form-label">Paid By</label>
              <input type="text" class="form-control" id="expense-paid-by" required />
            </div>
            <div class="col-md-3">
              <label for="expense-split" class="form-label">Split Between</label>
              <input
                type="text"
                class="form-control"
                id="expense-split"
                placeholder="Alice, Bob, Charlie"
                required
              />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-success w-100">Add Expense</button>
            </div>
          </form>
        </div>
      </div>

      <div id="expense-message" class="alert d-none"></div>

      <div class="row">
        <div class="col-lg-8">
          <h5>Expense History</h5>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-dark">
                <tr>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Paid By</th>
                  <th>Split Between</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expense-list"></tbody>
            </table>
          </div>
        </div>

        <div class="col-lg-4">
          <h5>Balance Summary</h5>
          <p class="text-muted small">Based on unsettled expenses only.</p>
          <ul id="balance-list" class="list-group"></ul>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/expensesPage.js"></script>
  </body>
</html>
