<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses - HouseholdHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/images/house.png" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/expenses.css" />
    <link rel="stylesheet" href="/css/toast.css" />
  </head>

  <body>
    <nav class="main-nav">
      <div class="nav-brand">
        <a href="/">HouseholdHub</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/people.html">People</a></li>
        <li><a href="/chores.html">Chores</a></li>
        <li><a href="/expenses.html" class="active">Expenses</a></li>
      </ul>
    </nav>

    <main class="expenses-container">
      <header class="page-header">
        <h1>Expense Tracker</h1>
        <p>Track and split shared household expenses</p>
      </header>

      <section class="balance-summary" id="balance-summary">
        <h2>Balance Summary</h2>
        <div class="balances" id="balances">
          <p class="loading">Loading balances...</p>
        </div>
      </section>

      <section class="expense-form-section">
        <h2>Add New Expense</h2>
        <form id="expense-form">
          <div class="form-group">
            <label for="expense-description">Description</label>
            <input
              type="text"
              id="expense-description"
              name="description"
              placeholder="e.g. Groceries from Trader Joe's"
              required
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expense-amount">Amount ($)</label>
              <input
                type="number"
                id="expense-amount"
                name="amount"
                step="0.01"
                min="0.01"
                placeholder="0.00"
                required
              />
            </div>
            <div class="form-group">
              <label for="expense-paidBy">Paid By</label>
              <select id="expense-paidBy" name="paidBy" required>
                <option value="">Select person</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="category">
                <option value="other">Other</option>
                <option value="groceries">Groceries</option>
                <option value="utilities">Utilities</option>
                <option value="rent">Rent</option>
                <option value="food">Food</option>
              </select>
            </div>
            <div class="form-group">
              <label for="expense-date">Date</label>
              <input type="date" id="expense-date" name="date" />
            </div>
          </div>
          <div class="form-group">
            <label>Split Between</label>
            <div class="checkbox-group" id="split-between-options">
              <p class="loading">Loading people...</p>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>
      </section>

      <section
        class="expense-filters"
        aria-labelledby="expense-filters-heading"
      >
        <h2 id="expense-filters-heading" class="sr-only">Filter expenses</h2>
        <label for="filter-category">Category:</label>
        <select id="filter-category">
          <option value="">All</option>
          <option value="groceries">Groceries</option>
          <option value="utilities">Utilities</option>
          <option value="rent">Rent</option>
          <option value="food">Food</option>
          <option value="other">Other</option>
        </select>
        <label for="filter-paidBy">Paid By:</label>
        <select id="filter-paidBy">
          <option value="">All</option>
        </select>
      </section>

      <section
        class="expense-list"
        id="expense-list"
        aria-labelledby="expense-list-heading"
      >
        <h2 id="expense-list-heading" class="sr-only">Expense list</h2>
        <p class="loading">Loading expenses...</p>
      </section>

      <div class="pagination" id="pagination"></div>
    </main>

    <script type="module" src="/js/expenses.js"></script>
  </body>
</html>
